<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZacFurniture Editor — edite seu móvel</title>
  <meta name="theme-color" content="#F7F5F0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
</head>
<body class="ed-body">
  <div class="fluted-backdrop" aria-hidden="true"></div>
  <header class="ed-top">
    <a href="index.html" class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Zac<b>Furniture</b> Editor</span></a>
    <div class="ed-actions">
      <button class="btn btn-glass" id="undoBtn" title="Desfazer">↶ Desfazer</button>
      <button class="btn btn-glass" id="redoBtn" title="Refazer">↷ Refazer</button>
      <a class="btn btn-glass" href="index.html">Voltar sem salvar</a>
      <button class="btn btn-sage" id="saveBtn">Salvar e voltar ao site</button>
    </div>
  </header>

  <main class="ed-main">
    <div class="ed-stage" id="edStage"><span class="ed-hint" id="edHint">Toque numa peça para selecionar · arraste para mover · gire com dois dedos</span></div>

    <aside class="ed-panel">
      <section class="ed-card">
        <h3>Projeto</h3>
        <input class="ed-name" id="projName" aria-label="Nome do projeto" />
        <div class="ed-row" id="projDims"></div>
      </section>

      <section class="ed-card">
        <h3>Adicionar peça</h3>
        <div class="ed-add" id="addGrid"></div>
      </section>

      <section class="ed-card" id="selCard">
        <h3>Peça selecionada</h3>
        <input class="ed-name" id="selName" aria-label="Nome da peça" />
        <div class="ed-fields" id="sizeFields"></div>
        <div class="ed-fields" id="posFields"></div>
        <div class="ed-row">Passo: <select id="stepSel"><option value="1">1 cm</option><option value="5">5 cm</option><option value="10">10 cm</option></select>
          <button class="ed-chip" id="dupBtn">Duplicar</button>
          <button class="ed-chip danger" id="delBtn">Remover</button>
        </div>
      </section>

      <section class="ed-card">
        <h3>Pintar</h3>
        <div class="ed-colors" id="colors"></div>
        <div class="ed-row"><button class="ed-chip" id="paintAllBtn">Pintar o móvel todo com a cor escolhida</button></div>
      </section>

      <section class="ed-card">
        <h3>Peças (<span id="partCount">0</span>)</h3>
        <div class="ed-list" id="partList"></div>
      </section>
    </aside>
  </main>
  <script type="module" src="./editor.js"></script>
</body>
</html>
